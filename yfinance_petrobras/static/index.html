<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrobras (PETR4) - Mercado Financeiro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --positive: #10b981;
            --negative: #ef4444;
            --accent: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 450px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-20deg);
            animation: shine 8s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .ticker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .ticker-name h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .ticker-name p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }

        .badge {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 0.4rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .price-container {
            margin-bottom: 2rem;
        }

        .price {
            font-size: 3rem;
            font-weight: 700;
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            line-height: 1;
        }

        .currency {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .change {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 0.8rem;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            display: inline-flex;
        }

        .change.positive {
            color: var(--positive);
            background: rgba(16, 185, 129, 0.1);
        }

        .change.negative {
            color: var(--negative);
            background: rgba(239, 68, 68, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.5rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }
        
        .error-message {
            color: var(--negative);
            text-align: center;
            padding: 2rem;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 12px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>Market Analytics</h1>
            <p>Dados em tempo real via Yahoo Finance</p>
        </div>

        <div class="card" id="stockCard">
            <div id="loader" class="loader">
                <div class="spinner"></div>
            </div>
            
            <div id="error" class="error-message hidden">
                <p>Falha ao carregar os dados. Tente novamente mais tarde.</p>
            </div>

            <div id="content" class="hidden">
                <div class="ticker-header">
                    <div class="ticker-name">
                        <h2 id="tickerSymbol">PETR4</h2>
                        <p>Petróleo Brasileiro S.A. - Petrobras</p>
                    </div>
                    <div class="badge">AÇÕES</div>
                </div>

                <div class="price-container">
                    <div class="price">
                        <span class="currency">R$</span>
                        <span id="currentPrice">--</span>
                    </div>
                    <div class="change" id="priceChange">
                        <span id="changeIcon"></span>
                        <span id="changeValue">--</span> (<span id="changePercent">--</span>%)
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">Abertura</span>
                        <span class="stat-value" id="openPrice">R$ --</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Volume</span>
                        <span class="stat-value" id="volume">--</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Alta Diária</span>
                        <span class="stat-value" id="highPrice">R$ --</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Baixa Diária</span>
                        <span class="stat-value" id="lowPrice">R$ --</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const formatCurrency = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'decimal', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
        };

        const formatNumber = (value) => {
            if (value >= 1e9) {
                return (value / 1e9).toFixed(2) + ' B';
            }
            if (value >= 1e6) {
                return (value / 1e6).toFixed(2) + ' M';
            }
            return new Intl.NumberFormat('pt-BR').format(value);
        };

        async function fetchStockData() {
            const ticker = 'PETR4.SA';
            try {
                const response = await fetch(`/api/price/${ticker}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                document.getElementById('currentPrice').textContent = formatCurrency(data.price);
                document.getElementById('openPrice').textContent = `R$ ${formatCurrency(data.open)}`;
                document.getElementById('highPrice').textContent = `R$ ${formatCurrency(data.high)}`;
                document.getElementById('lowPrice').textContent = `R$ ${formatCurrency(data.low)}`;
                document.getElementById('volume').textContent = formatNumber(data.volume);

                const changeEl = document.getElementById('priceChange');
                const changeIcon = document.getElementById('changeIcon');
                
                document.getElementById('changeValue').textContent = `R$ ${formatCurrency(Math.abs(data.change))}`;
                document.getElementById('changePercent').textContent = formatCurrency(Math.abs(data.change_percent));

                if (data.change >= 0) {
                    changeEl.className = 'change positive';
                    changeIcon.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>`;
                } else {
                    changeEl.className = 'change negative';
                    changeIcon.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg>`;
                }

                document.getElementById('loader').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

            } catch (error) {
                console.error('Error fetching stock data:', error);
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            }
        }

        // Fetch immediately and then every 1 minute
        fetchStockData();
        setInterval(fetchStockData, 60000);
    </script>
</body>
</html>
